name: Signed desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ATLAS_RELEASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw Error('Tag must match package version')"
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$MAC_CERTIFICATE_BASE64"
          ATLAS_CERT_PATH="$RUNNER_TEMP/atlas-certificate.p12"
          ATLAS_KEYCHAIN_PATH="$RUNNER_TEMP/atlas-signing.keychain-db"
          ATLAS_KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          export ATLAS_CERT_PATH
          python3 -c 'import os,base64; open(os.environ["ATLAS_CERT_PATH"],"wb").write(base64.b64decode(os.environ["MAC_CERTIFICATE_BASE64"]))'
          security create-keychain -p "$ATLAS_KEYCHAIN_PASSWORD" "$ATLAS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$ATLAS_KEYCHAIN_PATH"
          security unlock-keychain -p "$ATLAS_KEYCHAIN_PASSWORD" "$ATLAS_KEYCHAIN_PATH"
          security import "$ATLAS_CERT_PATH" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$ATLAS_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$ATLAS_KEYCHAIN_PASSWORD" "$ATLAS_KEYCHAIN_PATH"
          security list-keychains -d user -s "$ATLAS_KEYCHAIN_PATH" login.keychain-db
          rm "$ATLAS_CERT_PATH"
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        shell: pwsh
        run: |
          if (!$env:WINDOWS_CERTIFICATE_BASE64) { throw 'Windows signing certificate is required' }
          $atlasCert = Join-Path $env:RUNNER_TEMP 'atlas-certificate.pfx'
          [IO.File]::WriteAllBytes($atlasCert, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$atlasCert" >> $env:GITHUB_ENV
      - run: npm run test:desktop
      - run: npm run make:desktop
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - run: npm run test:desktop:packaged
      - run: npm run test:desktop:installed
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          ATLAS_APP="$(find out -maxdepth 2 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$ATLAS_APP"
          spctl --assess --type execute --verbose "$ATLAS_APP"
      - name: Verify Windows installer signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem out/make -Recurse -Filter *.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw "Invalid signature: $($_.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error
      - name: Delete signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/atlas-certificate.pfx" "$RUNNER_TEMP/atlas-certificate.p12"
          if [ "$RUNNER_OS" = macOS ]; then security delete-keychain "$RUNNER_TEMP/atlas-signing.keychain-db" || true; fi
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          fi
          find release-assets -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
