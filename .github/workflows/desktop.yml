name: Desktop preview
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install:browser -- --with-deps
      - run: npm test
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run package:desktop
      - run: npm run test:desktop:packaged
      - run: npx electron-forge make --from-package
      - run: node scripts/make-dmg.mjs
      - run: npm run test:desktop:installed
      - uses: actions/upload-artifact@v4
        with:
          name: viewport-atlas-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error
